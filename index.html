<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="16周减脂重组计划的饮食、训练和身体数据追踪工具" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>重组 16</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="date-label"></p>
          <h1 id="screen-title">今日</h1>
        </div>
        <button class="button button-quiet topbar-action" type="button" data-action="open-settings" aria-label="打开设置">
          <i data-lucide="settings-2"></i>
          <span>设置</span>
        </button>
      </header>

      <main id="screen" class="screen" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="主导航">
        <button type="button" class="nav-item is-active" data-nav="today">
          <i data-lucide="layout-dashboard"></i>
          <span>今日</span>
        </button>
        <button type="button" class="nav-item" data-nav="diet">
          <i data-lucide="utensils"></i>
          <span>饮食</span>
        </button>
        <button type="button" class="nav-item" data-nav="workout">
          <i data-lucide="dumbbell"></i>
          <span>训练</span>
        </button>
        <button type="button" class="nav-item" data-nav="calendar">
          <i data-lucide="calendar-days"></i>
          <span>日历</span>
        </button>
      </nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./lucide.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
